name: Compare Images and PDFs
# Compares the plotted content of images and the text content of PDFs in pull requests

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      curve_shift_tolerance_px:
        description: >-
          Maximum displacement in pixels by which plotted content may move between
          two revisions and still be considered unchanged. Compensates for purely
          cosmetic layout shifts introduced by the plotting engine.
        required: false
        default: '2'

jobs:
  compare-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow numpy scikit-image pdfplumber requests

    - name: Run image and PDF comparison
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CURVE_SHIFT_TOLERANCE_PX: ${{ inputs.curve_shift_tolerance_px || '2' }}
      run: >-
        python .github/scripts/compare-images-and-pdfs.py
        --curve-shift-tolerance-px "$CURVE_SHIFT_TOLERANCE_PX"
